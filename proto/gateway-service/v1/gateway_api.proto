syntax = "proto3";

package gateway_service.v1;
import "verification-service/v1/verification.proto";

option go_package = "github.com/errom502/protolib/gen/gateway-service/v1;gatewayv1";

// GatewayService сервис для взаимодействия с системой верификациями
service GatewayService {
    // Создание верификации
    rpc Create(CreateRequest) returns (CreateResponse);
    // Получение верификации по идентификатору
    rpc Get(GetRequest) returns (GetResponse);
    // Повторная верификация для существующей верификации
    rpc Retry(RetryRequest) returns (RetryResponse);
    // Фильтр
    //  Фильтры применяются по правилу "И"
    rpc Filter(FilterRequest) returns (FilterResponse);
}

message FilterRequest{
    // Набор идентификаторов верификаций
    repeated string ids = 1;
    // Набор внешних идентификаторов
    repeated string ext_ids = 2;
    // Набор значений целей (Пример: some.some@mail.ru)
    repeated string targets = 4;
    // Набор статусов варификации
    repeated verification_service.v1.VerificationStatus statuses = 5;
    // Тип провайдера
    optional verification_service.v1.ProviderType provider_type = 3;

    // Лимит
    int32 limit = 6;
    // Отступ
    int32 offset = 7;
}

message FilterResponse{
    repeated verification_service.v1.Verification verifications = 1;
    int32 total = 2; 
}

message RetryRequest{
    // Идентификатор верификации
    string id = 1;
}

message RetryResponse{
}

message GetRequest{
    // Идентификатор верификации
    string id = 1;
}

message GetResponse{
    // Верификация
    verification_service.v1.Verification verification = 1;
}

message CreateRequest{
    // Внешний идентификатор
    string ext_id = 1;
    // Тип провайдера
    verification_service.v1.ProviderType provider_type = 2;
    // Значение цели верификации (почта, номер телефона)
    string target = 3;
}

message CreateResponse{
    // Идентификатор верификации uuid
    string id = 1;
}
